 m.lineCap='round';m.lineJoin='round';for(let cls=5;cls>=0;cls--)for(const e of E){if(e.c!==cls)continue;m.strokeStyle=cls>=4?'#cfc6b4':'#f2f2f2';m.lineWidth=Math.max(1,RW[cls]*MS*1.6);m.beginPath();for(let k=0;k<e.f.length;k+=2){const [x,y]=P(e.f[k],e.f[k+1]);k?m.lineTo(x,y):m.moveTo(x,y)}m.stroke()}
 m.strokeStyle='#6b4a3a';m.lineWidth=2;m.beginPath();for(let k=0;k<RAIL.length;k+=2){const [x,y]=P(RAIL[k],RAIL[k+1]);k?m.lineTo(x,y):m.moveTo(x,y)}m.stroke();

function drawUI(){u.setTransform(UDPR,0,0,UDPR,0,0);u.clearRect(0,0,W,H);
  const R=Math.min(70,W*.17),cx=R+14,cy=R+14,p=pos(),ha=player.car?player.car.a:player.a,sc=R/(150*MS);
  u.save();u.beginPath();u.arc(cx,cy,R,0,7);u.clip();u.fillStyle='#3a80b2';u.fillRect(cx-R,cy-R,R*2,R*2);u.translate(cx,cy);u.scale(sc,sc);u.translate(-(p.x+D.hx)*MS,-(p.z+D.hz)*MS);u.drawImage(map,0,0);u.restore();
  const dot=(x,z,col,r,sym)=>{let rx=(x-p.x)*MS*sc,ry=(z-p.z)*MS*sc;const d=Math.hypot(rx,ry);if(d>R-7){rx*=(R-7)/d;ry*=(R-7)/d}u.fillStyle=col;u.strokeStyle='#000';u.lineWidth=1.5;u.beginPath();u.arc(cx+rx,cy+ry,r,0,7);u.fill();u.stroke();if(sym){u.fillStyle='#000';u.font='900 9px system-ui';u.textAlign='center';u.textBaseline='middle';u.fillText(sym,cx+rx,cy+ry+.5)}};
  for(const g of saucisses)if(g.t<=0&&Math.hypot(g.x-p.x,g.z-p.z)<160)dot(g.x,g.z,'#9cff57',3);

const HZo=19,HN=2**HZo,HR=LOW?95:140;
const hTiles=new Map();let hLoading=0,hActive=false;const texLoader=new THREE.TextureLoader();texLoader.setCrossOrigin('anonymous');
const lon2tx=lon=>(lon+180)/360*HN,lat2ty=lat=>{const r=lat*Math.PI/180;return(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*HN};
const tx2lon=tx=>tx/HN*360-180,ty2lat=ty=>{const n=Math.PI-2*Math.PI*ty/HN;return 180/Math.PI*Math.atan(.5*(Math.exp(n)-Math.exp(-n)))};
const hMat=t=>{const m=new THREE.MeshLambertMaterial({map:t,color:'#d6d6d6',polygonOffset:true,polygonOffsetFactor:-1,polygonOffsetUnits:-1});return m};
function hTile(tx,ty){const key=tx+'/'+ty;if(hTiles.has(key))return;const rec={mesh:null};hTiles.set(key,rec);hLoading++;
  texLoader.load(`https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.swissimage/default/current/3857/${HZo}/${tx}/${ty}.jpeg`,t=>{hLoading--;if(!hTiles.has(key)){t.dispose();return}
    t.anisotropy=8;const G=10,pos=[],uv=[],idx=[];for(let j=0;j<=G;j++)for(let i=0;i<=G;i++){const lon=tx2lon(tx+i/G),lat=ty2lat(ty+j/G);const x=(lon-LON0)*KXo,z=-(lat-LAT0)*KZo;pos.push(x,hf(x,z)+.07,z);uv.push(i/G,1-j/G)}
    for(let j=0;j<G;j++)for(let i=0;i<G;i++){const a=j*(G+1)+i,b=a+1,c=a+G+1,d=c+1;idx.push(a,c,b,b,c,d)}
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();
    const m=new THREE.Mesh(g,hMat(t));m.receiveShadow=true;scene.add(m);rec.mesh=m;if(!hActive){hActive=true;roadLayer.visible=false}},undefined,()=>{hLoading--;rec.failed=true})}
let hT=0;
function hiresUpdate(dt){hT-=dt;if(hT>0)return;hT=.4;const p=pos();const lon=LON0+p.x/KXo,lat=LAT0-p.z/KZo;const cx=lon2tx(lon),cy=lat2ty(lat);const tsz=40075016*Math.cos(LAT0*Math.PI/180)/HN;const rt=HR/tsz;
  const want=[];for(let ty=Math.floor(cy-rt);ty<=Math.floor(cy+rt);ty++)for(let tx=Math.floor(cx-rt);tx<=Math.floor(cx+rt);tx++){const d=Math.hypot(tx+.5-cx,ty+.5-cy);if(d<=rt+.7)want.push([d,tx,ty])}
  want.sort((a,b)=>a[0]-b[0]);for(const [d,tx,ty] of want){if(hLoading>=6)break;hTile(tx,ty)}
  for(const [key,rec] of hTiles){const [tx,ty]=key.split('/').map(Number);if(Math.hypot(tx+.5-cx,ty+.5-cy)>rt*1.7+1){if(rec.mesh){scene.remove(rec.mesh);rec.mesh.geometry.dispose();rec.mesh.material.map.dispose();rec.mesh.material.dispose()}hTiles.delete(key)}}}
